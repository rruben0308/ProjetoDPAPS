<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SADS — Redefinir senha</title>
  <link rel="stylesheet" href="/static/styles.css?v=auth3" />
  <link rel="icon" href="/static/assets/sads-logo.png?v=auth3" />
</head>
<body>
  <header class="nav" id="nav"></header>
  <main class="wrap" style="max-width:520px">
    <section class="hero">
      <div class="eyebrow">Nova senha</div>
      <h1 style="margin:0">Redefinir senha</h1>
      <p>Defina uma nova senha para acessar o SADS. O link expira em breve.</p>
    </section>
    <div id="alert" hidden></div>
    <section class="panel">
      <form id="form">
        <label>Nova senha * (min. 8)</label>
        <input name="password" type="password" required minlength="8" autocomplete="new-password" />
        <label>Confirmar senha *</label>
        <input name="password2" type="password" required minlength="8" autocomplete="new-password" />
        <button class="btn" type="submit">Salvar e entrar</button>
      </form>
      <p class="muted" style="margin-top:1rem">
        <a href="/login.html">Voltar ao login</a> ·
        <a href="/forgot-password.html">Pedir novo link</a>
      </p>
    </section>
  </main>
  <script src="/static/app.js?v=auth3"></script>
  <script>
    renderNav("login.html");
    const token = new URLSearchParams(location.search).get("token") || "";
    if (!token) {
      showAlert("alert", "Link incompleto. Solicite uma nova redefinicao de senha.");
      document.getElementById("form").hidden = true;
    }
    document.getElementById("form").onsubmit = async (ev) => {
      ev.preventDefault();
      hideAlert("alert");
      const fd = new FormData(ev.target);
      if (fd.get("password") !== fd.get("password2")) {
        showAlert("alert", "As senhas nao coincidem.");
        return;
      }
      const btn = ev.target.querySelector("button[type=submit]");
      btn.disabled = true;
      try {
        const auth = await api("/api/v1/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({
            token,
            password: fd.get("password"),
          }),
        });
        setAuthSession(auth);
        location.href = "/dashboard.html";
      } catch (err) {
        showAlert("alert", err.message);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
