<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SADS — Esqueci a senha</title>
  <link rel="stylesheet" href="/static/styles.css?v=auth3" />
  <link rel="icon" href="/static/assets/sads-logo.png?v=auth3" />
</head>
<body>
  <header class="nav" id="nav"></header>
  <main class="wrap" style="max-width:520px">
    <section class="hero">
      <div class="eyebrow">Recuperacao de acesso</div>
      <h1 style="margin:0">Esqueci a senha</h1>
      <p>
        Informe a empresa e o e-mail corporativo. Enviaremos um link para redefinir a senha
        (ou exibiremos o link aqui se o SMTP ainda nao estiver configurado).
      </p>
    </section>
    <div id="alert" hidden></div>
    <section class="panel">
      <form id="form">
        <label>Nome da empresa *</label>
        <input name="company_name" required autocomplete="organization" />
        <label>E-mail corporativo *</label>
        <input name="email" type="email" required autocomplete="username" />
        <button class="btn" type="submit">Enviar link de redefinicao</button>
      </form>
      <p id="reset-link-box" class="muted" style="margin-top:1rem;word-break:break-all" hidden></p>
      <p class="muted" style="margin-top:1rem">
        <a href="/login.html">Voltar ao login</a>
      </p>
    </section>
  </main>
  <script src="/static/app.js?v=auth3"></script>
  <script>
    renderNav("login.html");
    document.getElementById("form").onsubmit = async (ev) => {
      ev.preventDefault();
      hideAlert("alert");
      document.getElementById("reset-link-box").hidden = true;
      const fd = new FormData(ev.target);
      const btn = ev.target.querySelector("button[type=submit]");
      btn.disabled = true;
      try {
        const data = await api("/api/v1/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({
            company_name: fd.get("company_name"),
            email: fd.get("email"),
          }),
        });
        showAlert("alert", data.message, data.email_sent ? "ok" : "info");
        if (data.reset_url) {
          const box = document.getElementById("reset-link-box");
          box.hidden = false;
          box.innerHTML = `Link de redefinicao (valido por tempo limitado):<br><a href="${data.reset_url}">${data.reset_url}</a>`;
        }
      } catch (err) {
        showAlert("alert", err.message);
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
