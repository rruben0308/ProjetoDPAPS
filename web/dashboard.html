<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>try{var t=localStorage.getItem("rf_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")}catch(e){}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SADS — Painel</title>
  <link rel="stylesheet" href="/static/styles.css?v=clean2" />
  <link rel="icon" href="/static/assets/sads-logo.png?v=clean2" />
</head>
<body>
  <header class="nav" id="nav"></header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Painel</div>
      <h1 style="margin:0" id="welcome">Painel</h1>
      <p id="welcome-sub">Projetos, indicadores e recomendações da sua organização.</p>
    </section>

    <div id="alert" class="alert error" hidden></div>

    <section class="panel">
      <h2 style="margin-top:0">Atalhos</h2>
      <div class="cta-row">
        <a class="cta" href="/project-new.html">Subir novo projeto</a>
        <a class="cta secondary" href="/materials.html">Materiais</a>
        <a class="cta secondary" href="/applications.html">Recomendações</a>
        <a class="cta secondary" href="/employee.html">Equipe</a>
      </div>
    </section>

    <section class="panel">
      <h2 style="margin-top:0">Indicadores</h2>
      <div class="grid-metrics" id="metrics"></div>
    </section>

    <section class="panel" id="projects-panel" hidden>
      <h2 style="margin-top:0">Seus projetos</h2>
      <p class="muted">Abra o relatorio para ver dados do projeto e as recomendacoes de editais.</p>
      <div id="projects-list"></div>
    </section>

    <p class="footer-note">SADS · Sessao autenticada (senha). SSO na Fase B.</p>
  </main>
  <script src="/static/app.js?v=clean2"></script>
  <script>
    renderNav("dashboard.html");
    const s = requireAuth();
    if (!s) throw new Error("redirect");

    document.getElementById("welcome").textContent = `Olá, ${s.employeeName || "usuário"}`;
    document.getElementById("welcome-sub").textContent =
      `Visão geral · ${s.companyName || "Organização"}`;

    (async () => {
      try {
        const d = await api(`/api/v1/dashboard?company_id=${s.companyId}`);
        const hit = d.top3_hit_rate == null ? "—" : `${Math.round(d.top3_hit_rate * 100)}%`;
        document.getElementById("metrics").innerHTML = `
          <div class="metric"><div class="label">Projetos</div><div class="value">${d.projects_count}</div></div>
          <div class="metric"><div class="label">Avaliados</div><div class="value">${d.evaluated_count}</div></div>
          <div class="metric"><div class="label">Aprovados</div><div class="value">${d.approved_count}</div></div>
          <div class="metric"><div class="label">Rejeitados</div><div class="value">${d.rejected_count}</div></div>
          <div class="metric"><div class="label">Acerto top 3</div><div class="value">${hit}</div></div>
          <div class="metric"><div class="label">Economia est.</div><div class="value" style="font-size:1.2rem">${moneyBRL(d.estimated_savings_brl)}</div></div>
          <div class="metric"><div class="label">Documentos</div><div class="value">${d.documents_count}</div></div>
          <div class="metric"><div class="label">Funcionarios</div><div class="value">${d.employees_count}</div></div>`;

        const projects = await api(`/api/v1/projects?company_id=${s.companyId}`);
        if (projects.length) {
          document.getElementById("projects-panel").hidden = false;
          document.getElementById("projects-list").innerHTML = projects.slice(0, 12).map((p) => `
            <div class="project-list-item">
              <div>
                <strong>${p.title || "Projeto"}</strong>
                <div class="muted">${p.status || "—"} · ${p.created_at ? new Date(p.created_at).toLocaleString("pt-BR") : ""}</div>
              </div>
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <a class="btn ghost" style="margin-top:0" href="/project-evaluate.html?id=${p.id}">Ver relatorio</a>
                <a class="btn ghost" style="margin-top:0" href="/project-new.html?id=${p.id}">Editar</a>
              </div>
            </div>`).join("");
        }
      } catch (err) {
        showAlert("alert", err.message);
      }
    })();
  </script>
</body>
</html>
